name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & build
        run: dotnet build sip.csproj -c Release --nologo

      - name: Run tests
        run: dotnet test tests/Sip.Tests/Sip.Tests.csproj -c Release --nologo

      - name: Publish smoke (win-x64)
        run: dotnet publish sip.csproj -c Release -r win-x64 --self-contained -o publish-ci --nologo
